name: gateway

services:
  gateway:
    image: ${GATEWAY_IMAGE:?Set pinned gateway image}
    restart: unless-stopped
    ports:
      - "192.0.2.10:8099:8000"
    volumes:
      - ./config:/app/config:ro
    environment:
      GATEWAY_CONFIG: /app/config/gateway.json
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=5);
          raise SystemExit(0 if json.load(response) == {"status": "ok"} else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
